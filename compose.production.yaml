services:
    traefik:
        image: traefik:v3.6.7
        restart: unless-stopped
        volumes:
            - /run/user/1018/docker.sock:/var/run/docker.sock:ro
        command:
            - "--providers.docker=true"
            - "--providers.docker.exposedByDefault=false"
            - "--entrypoints.web.address=:80"
        ports:
            - "127.0.0.1:8082:80"
        networks:
            - order-panel-network
    database:
        image: ghcr.io/alex4270/order-panel-database:latest
    frontend:
        image: ghcr.io/alex4270/order-panel-frontend:${FRONTEND_TAG}
        restart: unless-stopped
        networks:
            - order-panel-network
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.${APP_NAMESPACE}-frontend.rule=PathPrefix(`/`)"
            - "traefik.http.routers.${APP_NAMESPACE}-frontend.entrypoints=web"
            - "traefik.http.services.${APP_NAMESPACE}-frontend.loadbalancer.server.port=80"
    backend:
        image: ghcr.io/alex4270/order-panel-backend:${BACKEND_TAG}
        restart: unless-stopped
        env_file: .env.backend
        volumes:
            - backend-storage:/var/www/html/storage/app
            - backend-logs:/var/www/html/storage/logs
        depends_on:
            - database
        networks:
            - order-panel-network
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.${APP_NAMESPACE}-backend.rule=PathPrefix(`/api`) || PathPrefix(`/broadcasting`)"
            - "traefik.http.routers.${APP_NAMESPACE}-backend.entrypoints=web"
            - "traefik.http.services.${APP_NAMESPACE}-backend.loadbalancer.server.port=80"
    queue:
        image: ghcr.io/alex4270/order-panel-backend:${BACKEND_TAG}
        restart: unless-stopped
        env_file: .env.backend
        volumes:
            - backend-storage:/var/www/html/storage/app
            - backend-logs:/var/www/html/storage/logs
        depends_on:
            - database
        networks:
            - order-panel-network
        command: sh -c "php artisan queue:work"
    reverb:
        image: ghcr.io/alex4270/order-panel-backend:${BACKEND_TAG}
        restart: unless-stopped
        env_file: .env.backend
        volumes:
            - backend-logs:/var/www/html/storage/logs
        networks:
            - order-panel-network
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.${APP_NAMESPACE}-reverb.rule=PathPrefix(`/ws`)"
            - "traefik.http.routers.${APP_NAMESPACE}-reverb.entrypoints=web"
            - "traefik.http.routers.${APP_NAMESPACE}-reverb.middlewares=${APP_NAMESPACE}-reverb-strip"
            - "traefik.http.middlewares.${APP_NAMESPACE}-reverb-strip.stripprefix.prefixes=/ws"
            - "traefik.http.services.${APP_NAMESPACE}-reverb.loadbalancer.server.port=8080"
        command: sh -c "php artisan reverb:start"
    scheduler:
        image: ghcr.io/alex4270/order-panel-backend:${BACKEND_TAG}
        restart: unless-stopped
        env_file: .env.backend
        volumes:
            - backend-storage:/var/www/html/storage/app
            - backend-logs:/var/www/html/storage/logs
        depends_on:
            - database
        networks:
            - order-panel-network
        command: sh -c "php artisan schedule:work"
volumes:
    backend-storage:
        name: ${APP_NAMESPACE}-backend-storage
    backend-logs:
        name: ${APP_NAMESPACE}-backend-logs
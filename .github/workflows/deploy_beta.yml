name: Build And Deploy To Beta Environment

on:
    push:
        branches: 
            - staging
    
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_OWNER: alex4270
    BACKEND_IMAGE: order-panel-backend
    FRONTEND_IMAGE: order-panel-frontend

jobs:
    test-backend:
      uses: ./.github/workflows/test_backend.yml

    build-backend:
        runs-on: ubuntu-latest
        needs: [test-backend]

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                registry: ${{env.REGISTRY}}
                username: ${{github.actor}}
                password: ${{secrets.GITHUB_TOKEN}}

            - name: Build and push backend image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./docker/backend/Dockerfile
                platforms: linux/amd64
                push: true
                tags: |
                    ${{env.REGISTRY}}/${{env.IMAGE_OWNER}}/${{env.BACKEND_IMAGE}}:dev
                    ${{env.REGISTRY}}/${{env.IMAGE_OWNER}}/${{env.BACKEND_IMAGE}}:${{github.sha}}
                cache-from: type=gha
                cache-to: type=gha,mode=max

    build-frontend:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Create beta environment file
              env:
                ENV_FRONTEND_BETA: ${{secrets.ENV_FRONTEND_BETA}}
              run: |
                if [ -z "$ENV_FRONTEND_BETA" ]; then
                    echo "::error::Repository secret ENV_FRONTEND_BETA is not set"
                    exit 1
                fi
                printf '%s\n' "$ENV_FRONTEND_BETA" > frontend/src/environments/environment.beta.ts
            
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with: 
                registry: ${{env.REGISTRY}}
                username: ${{github.actor}}
                password: ${{secrets.GITHUB_TOKEN}}

            - name: Build and push frontend image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./docker/frontend/Dockerfile
                platforms: linux/amd64
                push: true
                tags: |
                    ${{env.REGISTRY}}/${{env.IMAGE_OWNER}}/${{env.FRONTEND_IMAGE}}:dev
                    ${{env.REGISTRY}}/${{env.IMAGE_OWNER}}/${{env.FRONTEND_IMAGE}}:${{github.sha}}
                build-args: |
                    CONFIG=beta
                cache-from: type=gha
                cache-to: type=gha,mode=max

    deploy:
        runs-on: ubuntu-latest
        needs: [test-backend, build-backend, build-frontend]

        steps:
            - name: Deploy to production (ssh)
              uses: appleboy/ssh-action@v1
              with: 
                host: ${{secrets.SSH_HOST}}
                username: ${{secrets.SSH_USERNAME}}
                key: ${{secrets.SSH_PRIVATE_KEY}}
                port: ${{secrets.SSH_PORT}}
                script: |
                    set -e
                    cd /var/www/order-panel-beta

                    echo "${{secrets.ENV_WORKSPACE_BETA}}" | base64 -d > .env
                    chmod 600 .env

                    echo "${{secrets.ENV_BACKEND_BETA}}" | base64 -d > .env.backend
                    chmod 600 .env.backend

                    echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u ${{github.actor}} --password-stdin

                    export BACKEND_TAG=${{github.sha}}
                    export FRONTEND_TAG=${{github.sha}}

                    docker compose -f compose.yaml -f compose.beta.yaml pull

                    docker compose -f compose.yaml -f compose.beta.yaml up -d --remove-orphans

                    docker image prune -f
